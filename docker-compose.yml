services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: lyoko-ai-ops-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lyoko} -d ${POSTGRES_DB:-lyoko}"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lyoko}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lyoko}
      POSTGRES_DB: ${POSTGRES_DB:-lyoko}
    env_file:
      - path: .env
        required: false

  sector5-mcp:
    build:
      context: .
      dockerfile: packages/mcps/sector5-mcp/Dockerfile
    container_name: lyoko-ai-ops-sector5
    restart: unless-stopped
    ports:
      - "${MCP_PORT:-8000}:8000"
    environment:
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./packages/mcps/sector5-mcp/src:/app/packages/mcps/sector5-mcp/src:ro

  migration:
    build:
      context: .
      dockerfile: packages/agents/lyoko/Dockerfile
    container_name: lyoko-ai-ops-migration
    restart: "no"
    command: ["alembic", "-c", "/app/packages/agents/lyoko/alembic.ini", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: "postgres"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lyoko}
    env_file:
      - path: .env
        required: false

  lyoko:
    build:
      context: .
      dockerfile: packages/agents/lyoko/Dockerfile
    container_name: lyoko-ai-ops-lyoko
    restart: unless-stopped
    ports:
      - "${LYOKO_PORT:-9000}:9000"
    depends_on:
      postgres:
        condition: service_healthy
      sector5-mcp:
        condition: service_started
      migration:
        condition: service_completed_successfully
    environment:
      LYOKO_HOST: "0.0.0.0"
      LYOKO_PORT: "9000"
      MCP_SERVER_URL: "http://sector5-mcp:8000/mcp"
      POSTGRES_HOST: "postgres"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lyoko}
      PYTHONPATH: "/app/packages/agents/lyoko/src"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./packages/agents/lyoko/src:/app/packages/agents/lyoko/src:ro
      - ./packages/agents/lyoko/migrations:/app/packages/agents/lyoko/migrations:ro
      - ./packages/agents/lyoko/alembic.ini:/app/packages/agents/lyoko/alembic.ini:ro
      - hermes_data:/app/.hermes

volumes:
  postgres_data:
  hermes_data:
