services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: lyoko-ai-ops-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lyoko} -d ${POSTGRES_DB:-lyoko}"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lyoko}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lyoko}
      POSTGRES_DB: ${POSTGRES_DB:-lyoko}
    env_file:
      - path: .env
        required: false

  sector5-mcp:
    build:
      context: .
      dockerfile: packages/mcps/sector5-mcp/Dockerfile
    container_name: lyoko-ai-ops-sector5
    restart: unless-stopped
    ports:
      - "${MCP_PORT:-8000}:8000"
    environment:
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8000"
      FASTMCP_TELEMETRY_MODE: "off"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./packages/mcps/sector5-mcp/src:/app/packages/mcps/sector5-mcp/src:ro

  hermes:
    image: nousresearch/hermes-agent:rc.15-v0.21.7
    container_name: lyoko-ai-ops-hermes
    restart: unless-stopped
    command: ["gateway", "run"]
    ports:
      - "${HERMES_PORT:-8642}:8642"
      - "${HERMES_DASHBOARD_PORT:-9119}:9119"
    environment:
      HERMES_HOME: "/opt/data"
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_KEY: ${HERMES_API_KEY:-lyoko-hermes-secret-key}
      HERMES_SINGLE_QUERY_SESSION: "1"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_DIAGNOSE_MODEL: ${OPENAI_DIAGNOSE_MODEL:-gpt-4.1}
      LYOKO_GATED_MCP_URL: http://lyoko:9000/gated-mcp/mcp
      LYOKO_GATED_MCP_TOKEN: ${LYOKO_GATED_MCP_TOKEN:-lyoko-gated-local-token}
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: "0.0.0.0"
      HERMES_DASHBOARD_PORT: "9119"
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_USER:-admin}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_PASSWORD:-lyoko-dashboard}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
      HERMES_LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      HERMES_LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      HERMES_LANGFUSE_BASE_URL: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
      HERMES_LANGFUSE_CAPTURE: "full"
      HERMES_LANGFUSE_DEBUG: "true"
    volumes:
      - hermes_data:/opt/data
      - ./packages/agents/lyoko/hermes_config.yaml:/opt/data/config.yaml:rw
      - ./packages/agents/lyoko/init-hermes-langfuse.sh:/etc/cont-init.d/03-langfuse:ro

  lyoko:
    build:
      context: .
      dockerfile: packages/agents/lyoko/Dockerfile
    container_name: lyoko-ai-ops-lyoko
    restart: unless-stopped
    ports:
      - "${LYOKO_PORT:-9000}:9000"
    depends_on:
      postgres:
        condition: service_healthy
      sector5-mcp:
        condition: service_started
      hermes:
        condition: service_started
    environment:
      LYOKO_HOST: "0.0.0.0"
      LYOKO_PORT: "9000"
      MCP_SERVER_URL: "http://sector5-mcp:8000/mcp"
      HERMES_SERVER_URL: "http://hermes:8642"
      HERMES_API_KEY: ${HERMES_API_KEY:-lyoko-hermes-secret-key}
      LYOKO_GATED_MCP_TOKEN: ${LYOKO_GATED_MCP_TOKEN:-lyoko-gated-local-token}
      POSTGRES_HOST: "postgres"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lyoko}
      PYTHONPATH: "/app/packages/agents/lyoko/src"
      LANGFUSE_ENABLED: ${LANGFUSE_ENABLED:-true}
      FASTMCP_TELEMETRY_MODE: "off"
      LYOKO_ORCHESTRATOR: ${LYOKO_ORCHESTRATOR:-hermes}
    env_file:
      - path: .env
        required: false
    volumes:
      - ./packages/agents/lyoko/src:/app/packages/agents/lyoko/src:ro
      - hermes_data:/app/.hermes

volumes:
  postgres_data:
  hermes_data:
