_config_version: 50

# ── Security ──────────────────────────────────────────────────────────
# Secret redaction is ON by default — strings that look like API keys,
# tokens, and passwords are masked in tool output, logs, and chat
# responses before the model or user ever sees them. Set redact_secrets
# to false to disable (e.g. when developing the redactor itself).
#
# security:
#   redact_secrets: true

# ── Fallback Model ────────────────────────────────────────────────────
# Automatic provider failover when primary is unavailable.
# Uncomment and configure to enable. Triggers on rate limits (429),
# overload (529), service errors (503), or connection failures.
#
# Supported providers:
#   openrouter   (OPENROUTER_API_KEY)  — routes to any model
#   openai-codex (OAuth — hermes auth) — OpenAI Codex
#   nous         (OAuth — hermes auth) — Nous Portal
#   zai          (ZAI_API_KEY)         — Z.AI / GLM
#   kimi-coding  (KIMI_API_KEY)        — Kimi / Moonshot
#   kimi-coding-cn (KIMI_CN_API_KEY)   — Kimi / Moonshot (China)
#   minimax      (MINIMAX_API_KEY)     — MiniMax
#   minimax-cn   (MINIMAX_CN_API_KEY)  — MiniMax (China)
#   bedrock      (AWS IAM / boto3)     — AWS Bedrock (Converse API)
#
# For custom OpenAI-compatible endpoints, add base_url and key_env.
#
# fallback_model:
#   provider: openrouter
#   model: anthropic/claude-sonnet-4
dashboard:
  font: system-sans
  theme: midnight

# Hermes only sees Lyoko's gated MCP proxy: every tool call goes through the operator
# approval gate. Native toolsets (terminal, file, browser, ...) are disabled for the API server.
mcp_servers:
  lyoko:
    url: "${LYOKO_GATED_MCP_URL}"
    headers:
      Authorization: "Bearer ${LYOKO_GATED_MCP_TOKEN}"

tools:
  tool_search:
    enabled: "off"

plugins:
  enabled:
    - observability/langfuse

platform_toolsets:
  api_server:
    - lyoko
    - memory
    - delegation
  cli:
    - browser
    - clarify
    - code_execution
    - computer_use
    - connections
    - cronjob
    - delegation
    - file
    - image_gen
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - tts
    - vision
    - web
platforms:
  api_server:
    direct_model_requests: true

model:
  default: "${OPENAI_DIAGNOSE_MODEL}"
  provider: openai-api
  base_url: https://api.openai.com/v1
  api_mode: codex_responses
delegation:
  model: "${OPENAI_MODEL}"
memory:
  model: "${OPENAI_MODEL}"
  nudge_interval: 1
compaction:
  model: "${OPENAI_MODEL}"
auxiliary:
  compression:
    model: "${OPENAI_MODEL}"
  vision:
    model: "${OPENAI_MODEL}"
  title_generation:
    prefer_fast_model: true
telemetry:
  shared_metrics:
    enabled: true
    send: false
    offer_version: 2
browser:
  backend: browser-use
computer_use:
  backend: cua
known_plugin_toolsets:
  cli:
    - a2a
known_builtin_toolsets:
  cli:
    - browser
    - clarify
    - code_execution
    - computer_use
    - connections
    - context_engine
    - cronjob
    - delegation
    - discord
    - discord_admin
    - file
    - image_gen
    - kanban
    - memory
    - session_search
    - skills
    - stt
    - terminal
    - todo
    - tts
    - video
    - video_gen
    - vision
    - web
    - x_search
    - yuanbao

